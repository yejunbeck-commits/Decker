<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png?v=1">
    <title>Decker</title>
    <style>
        :root {
            --bg-color: #FEFEFE;
            --bg-rgb: 254, 254, 254;
            --text-color: #111111;
            --card-shadow: 0 24px 48px rgba(0, 0, 0, 0.08);
            --card-shadow-inactive: 0 8px 24px rgba(0, 0, 0, 0.04);
            --control-bg: rgba(255, 255, 255, 0.85);
            --control-border: rgba(0, 0, 0, 0.05);
            --transition-smooth: 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            --ui-shadow: 0 16px 40px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.06);
        }

        body.dark-mode {
            --bg-color: #111111;
            --bg-rgb: 17, 17, 17;
            --text-color: #FEFEFE;
            --card-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
            --card-shadow-inactive: 0 8px 24px rgba(0, 0, 0, 0.3);
            --control-bg: rgba(30, 30, 30, 0.85);
            --control-border: rgba(255, 255, 255, 0.1);
            --ui-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        /* 상단 및 하단 배경색 그라데이션 페이드 (바깥쪽 카드들이 자연스럽게 묻히도록 깊이감 조정) */
        .fade-overlay {
            position: fixed;
            left: 0;
            width: 100%;
            height: 28vh;
            pointer-events: none;
            z-index: 20;
            transition: background 0.5s ease;
        }

        .fade-top {
            top: 0;
            background: linear-gradient(
                to bottom,
                rgba(var(--bg-rgb), 1) 20%,
                rgba(var(--bg-rgb), 0.7) 55%,
                rgba(var(--bg-rgb), 0) 100%
            );
        }

        .fade-bottom {
            bottom: 0;
            background: linear-gradient(
                to top,
                rgba(var(--bg-rgb), 1) 20%,
                rgba(var(--bg-rgb), 0.7) 55%,
                rgba(var(--bg-rgb), 0) 100%
            );
        }

        .controls-wrapper {
            position: fixed;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 100;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .controls-wrapper.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            background: var(--control-bg);
            padding: 12px 24px;
            border-radius: 100px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--control-border);
            box-shadow: var(--ui-shadow);
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 50px;
            transition: all 0.3s ease;
            letter-spacing: -0.2px;
        }

        .control-btn:hover {
            background: rgba(150, 150, 150, 0.1);
        }

        .control-btn.active {
            background: var(--text-color);
            color: var(--bg-color);
        }

        .divider {
            width: 1px;
            background: var(--control-border);
            margin: 0 4px;
        }

        .hide-ui-btn {
            position: fixed;
            bottom: 40px;
            right: 40px;
            background: var(--control-bg);
            border: 1px solid var(--control-border);
            color: var(--text-color);
            font-size: 13px;
            font-weight: 500;
            padding: 12px 20px;
            border-radius: 100px;
            cursor: pointer;
            z-index: 101;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--ui-shadow);
            transition: all 0.3s ease;
        }

        .hide-ui-btn:hover {
            background: rgba(150, 150, 150, 0.1);
        }

        input[type="file"] {
            display: none;
        }

        /* 세로 캐러셀 컨테이너 */
        .stack-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .empty-state {
            position: absolute;
            text-align: center;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .empty-state h1 {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: -0.4px;
            opacity: 0.8;
            margin: 0;
            color: var(--text-color);
        }

        .empty-state p {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            opacity: 0.4;
            margin: 0;
            color: var(--text-color);
        }

        /* 카드 기본 스타일 */
        .card {
            position: absolute;
            width: 480px;
            border-radius: 18px;
            overflow: hidden;
            background-color: transparent;
            box-shadow: var(--card-shadow-inactive);
            transition: transform var(--transition-smooth), opacity var(--transition-smooth), box-shadow var(--transition-smooth);
            cursor: pointer;
            transform-origin: center center;
            will-change: transform, opacity;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .card.is-center {
            box-shadow: var(--card-shadow);
        }

        .card.ratio-1-1 {
            width: 340px;
            aspect-ratio: 1 / 1;
        }

        .card.ratio-16-9 {
            width: 500px;
            aspect-ratio: 16 / 9;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            display: block;
            background-color: transparent;
        }

        @media (max-width: 768px) {
            .card.ratio-1-1 {
                width: 68vw;
            }
            .card.ratio-16-9 {
                width: 82vw;
            }
        }
    </style>
</head>

<body>

    <div class="fade-overlay fade-top"></div>
    <div class="fade-overlay fade-bottom"></div>

    <div class="stack-container" id="stackContainer">
        <div class="empty-state" id="emptyState">
            <h1>Upload images to begin</h1>
            <p>By yejunbeck.com</p>
        </div>
    </div>

    <div class="controls-wrapper" id="controlsWrapper">
        <div class="controls">
            <label class="control-btn" for="fileInput">Upload</label>
            <input type="file" id="fileInput" multiple accept="image/*">

            <div class="divider"></div>

            <button class="control-btn active" id="ratio11">1:1</button>
            <button class="control-btn" id="ratio169">16:9</button>

            <div class="divider"></div>

            <button class="control-btn" id="themeToggle">Dark</button>

            <div class="divider"></div>

            <button class="control-btn" id="playToggle">Play</button>
            <button class="control-btn" id="speedControl">CONTROLS: Normal</button>
        </div>
    </div>

    <button class="hide-ui-btn" id="hideUiToggle">Hide UI</button>

    <script>
        const fileInput = document.getElementById('fileInput');
        const stackContainer = document.getElementById('stackContainer');
        const emptyState = document.getElementById('emptyState');
        const themeToggle = document.getElementById('themeToggle');
        const ratio11Btn = document.getElementById('ratio11');
        const ratio169Btn = document.getElementById('ratio169');
        const playToggle = document.getElementById('playToggle');
        const speedControl = document.getElementById('speedControl');
        const hideUiToggle = document.getElementById('hideUiToggle');
        const controlsWrapper = document.getElementById('controlsWrapper');

        let currentRatio = 'ratio-1-1';
        let isAnimating = false;
        let isPlaying = false;
        let autoPlayTimer;
        let activeIndex = 0;

        const speeds = [
            { label: 'Normal', delay: 1800 },
            { label: 'Fast', delay: 1200 },
            { label: 'Slow', delay: 2800 }
        ];
        let currentSpeedIndex = 0;

        hideUiToggle.addEventListener('click', () => {
            controlsWrapper.classList.toggle('hidden');
            if (controlsWrapper.classList.contains('hidden')) {
                hideUiToggle.textContent = 'Show UI';
            } else {
                hideUiToggle.textContent = 'Hide UI';
            }
        });

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            themeToggle.textContent = document.body.classList.contains('dark-mode') ? 'Light' : 'Dark';
        });

        ratio11Btn.addEventListener('click', () => {
            setRatio('ratio-1-1', ratio11Btn, ratio169Btn);
            updateStack();
        });

        ratio169Btn.addEventListener('click', () => {
            setRatio('ratio-16-9', ratio169Btn, ratio11Btn);
            updateStack();
        });

        function setRatio(ratioClass, activeBtn, inactiveBtn) {
            currentRatio = ratioClass;
            activeBtn.classList.add('active');
            inactiveBtn.classList.remove('active');

            document.querySelectorAll('.card').forEach(card => {
                card.classList.remove('ratio-1-1', 'ratio-16-9');
                card.classList.add(currentRatio);
            });
        }

        speedControl.addEventListener('click', () => {
            currentSpeedIndex = (currentSpeedIndex + 1) % speeds.length;
            const speedSettings = speeds[currentSpeedIndex];

            speedControl.textContent = `CONTROLS: ${speedSettings.label}`;

            if (isPlaying) {
                clearTimeout(autoPlayTimer);
                scheduleNextCard();
            }
        });

        playToggle.addEventListener('click', () => {
            const cards = document.querySelectorAll('.card');
            if (cards.length <= 1) return;

            isPlaying = !isPlaying;
            playToggle.textContent = isPlaying ? 'Pause' : 'Play';
            playToggle.classList.toggle('active', isPlaying);

            if (isPlaying) {
                scheduleNextCard();
            } else {
                clearTimeout(autoPlayTimer);
            }
        });

        function scheduleNextCard() {
            const currentDelay = speeds[currentSpeedIndex].delay;
            autoPlayTimer = setTimeout(() => {
                if (isPlaying) {
                    triggerNextCard();
                    scheduleNextCard();
                }
            }, currentDelay);
        }

        // 마우스 휠 스크롤로 위아래 이동 지원
        let wheelTimeout;
        window.addEventListener('wheel', (e) => {
            if (isPlaying || isAnimating) return;
            const cards = document.querySelectorAll('.card');
            if (cards.length <= 1) return;

            clearTimeout(wheelTimeout);
            wheelTimeout = setTimeout(() => {
                if (e.deltaY > 15) {
                    triggerNextCard();
                } else if (e.deltaY < -15) {
                    triggerPrevCard();
                }
            }, 40);
        }, { passive: true });

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length > 0) {
                emptyState.style.display = 'none';
            }

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    createCard(ev.target.result);
                };
                reader.readAsDataURL(file);
            });
            fileInput.value = '';
        });

        function createCard(imageSrc) {
            const card = document.createElement('div');
            card.className = `card ${currentRatio}`;

            const img = document.createElement('img');
            img.src = imageSrc;

            card.appendChild(img);
            stackContainer.appendChild(card);

            card.addEventListener('click', () => {
                if (isPlaying) return;
                const cards = Array.from(stackContainer.querySelectorAll('.card'));
                const clickedIndex = cards.indexOf(card);
                if (clickedIndex !== activeIndex) {
                    activeIndex = clickedIndex;
                    updateStack();
                } else {
                    triggerNextCard();
                }
            });

            updateStack();
        }

        function updateStack() {
            const cards = Array.from(stackContainer.querySelectorAll('.card'));
            const total = cards.length;
            if (total === 0) return;

            // 중앙 카드(1.0)와 나머지 4장(위 2장, 아래 2장)의 동일한 축소 규격(0.54)
            const centerScale = 1;
            const sideScale = 0.54;
            const firstOffset = currentRatio === 'ratio-1-1' ? 280 : 235;
            const stepOffset = currentRatio === 'ratio-1-1' ? 205 : 175;

            cards.forEach((card, index) => {
                // 5장(-2, -1, 0, +1, +2) 기준 순환 거리 계산
                let diff = index - activeIndex;
                if (total > 4) {
                    if (diff > total / 2) diff -= total;
                    if (diff < -total / 2) diff += total;
                }

                card.classList.toggle('is-center', diff === 0);

                if (diff === 0) {
                    card.style.zIndex = 10;
                    card.style.transform = `translateY(0px) scale(${centerScale})`;
                    card.style.opacity = 1;
                    card.style.pointerEvents = 'auto';
                } else if (Math.abs(diff) === 1) {
                    const sign = diff > 0 ? 1 : -1;
                    const yOffset = sign * firstOffset;
                    card.style.zIndex = 6;
                    card.style.transform = `translateY(${yOffset}px) scale(${sideScale})`;
                    card.style.opacity = 0.95;
                    card.style.pointerEvents = 'auto';
                } else if (Math.abs(diff) === 2) {
                    // 4번째, 5번째 카드가 상하단 그라데이션 영역에 걸쳐 자연스럽게 페이드되도록 배치
                    const sign = diff > 0 ? 1 : -1;
                    const yOffset = sign * (firstOffset + stepOffset);
                    card.style.zIndex = 4;
                    card.style.transform = `translateY(${yOffset}px) scale(${sideScale})`;
                    card.style.opacity = 0.95;
                    card.style.pointerEvents = 'auto';
                } else {
                    const sign = diff > 0 ? 1 : -1;
                    const yOffset = sign * (firstOffset + stepOffset * 2);
                    card.style.zIndex = 1;
                    card.style.transform = `translateY(${yOffset}px) scale(${sideScale})`;
                    card.style.opacity = 0;
                    card.style.pointerEvents = 'none';
                }
            });
        }

        function triggerNextCard() {
            if (isAnimating) return;
            const cards = Array.from(stackContainer.querySelectorAll('.card'));
            if (cards.length <= 1) return;

            isAnimating = true;
            activeIndex = (activeIndex + 1) % cards.length;
            updateStack();

            setTimeout(() => {
                isAnimating = false;
            }, 550);
        }

        function triggerPrevCard() {
            if (isAnimating) return;
            const cards = Array.from(stackContainer.querySelectorAll('.card'));
            if (cards.length <= 1) return;

            isAnimating = true;
            activeIndex = (activeIndex - 1 + cards.length) % cards.length;
            updateStack();

            setTimeout(() => {
                isAnimating = false;
            }, 550);
        }
    </script>
</body>

</html>
